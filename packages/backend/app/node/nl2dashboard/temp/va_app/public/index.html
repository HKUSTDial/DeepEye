<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepEye Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入基础库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
    <style>
        .fade-in { animation: fadeIn 0.8s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans">

    <!-- 实际的 Dashboard 挂载点 -->
    <div id="app-root" class="w-full h-screen">
        <div id="init-loader" class="flex flex-col items-center justify-center h-full text-indigo-600 font-medium bg-white">
            <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p>正在初始化图表引擎...</p>
        </div>
    </div>

    <!-- 脚本加载逻辑 -->
    <script>
        window.addEventListener('load', function() {
            console.log("Dashboard container loaded. Initializing...");
            
            // 立即尝试加载核心逻辑
            const script = document.createElement('script');
            script.src = "public/app.js"; // 相对路径
            script.onload = function() {
                console.log("Core JS loaded successfully.");
                // app.js 会处理 app-root 的内容替换
            };
            script.onerror = function() {
                showError('❌ 图表引擎 (app.js) 加载失败，请检查 404/500 错误');
            };
            document.body.appendChild(script);
        });

        function showError(msg) {
            const root = document.getElementById('app-root');
            if (root) {
                root.innerHTML = `<div class="flex items-center justify-center h-full w-full">
                    <div class="p-8 text-red-500 bg-red-50 border border-red-200 rounded-lg m-4 max-w-md shadow-sm">
                        <h3 class="font-bold mb-2">初始化失败</h3>
                        <p>${msg}</p>
                    </div>
                </div>`;
            }
        }
        
        // 全局捕获 App.js 内部的异步错误
        window.addEventListener('unhandledrejection', function(event) {
            console.error('Unhandled promise rejection:', event.reason);
            showError('Dashboard 数据加载失败: ' + (event.reason.message || 'Unknown error'));
        });
    </script>
</body>
</html>

[project]
name = "deepeye-backend"
version = "0.1.0"
description = "DeepEye Backend Service"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.1",
    "python-multipart>=0.0.9",
    "celery>=5.3.6",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.0.0",
    "langgraph-checkpoint-postgres>=1.0.0",
    "psycopg[binary,pool]>=3.1.8",
    "deepeye[openai]",
]

[tool.uv.sources]
deepeye = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

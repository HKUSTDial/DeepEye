[project]
name = "deepeye-backend"
version = "0.1.0"
description = "DeepEye Backend API Service"
requires-python = ">=3.10"
dependencies = [
    # DeepEye Core SDK
    "deepeye-core",
    
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    
    # Database
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pymysql>=1.1.0",
    
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.0.0",  # bcrypt 5.0.0 has compatibility issues with passlib 1.7.4
    "python-multipart>=0.0.12",
    
    # Email
    "aiosmtplib>=3.0.0",
    "email-validator>=2.1.0",
    
    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    
    # Utils
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.uv.sources]
deepeye-core = { path = "../deepeye-core", editable = true }

# [[tool.uv.index]]
# name = "TencentCloud"
# url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
skip = [".venv"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"


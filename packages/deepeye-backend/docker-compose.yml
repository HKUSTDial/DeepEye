version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: deepeye-postgres
    environment:
      # PostgreSQL 配置 - 从环境变量读取，默认值在 env.example 中定义
      POSTGRES_DB: ${POSTGRES_DB:-deepeye}
      POSTGRES_USER: ${POSTGRES_USER:-deepeye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepeye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepeye}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepeye-network

  # 可选：pgAdmin 管理界面
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: deepeye-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@deepeye.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deepeye-network
    profiles:
      - tools  # 使用 docker-compose --profile tools up 启动

  # MySQL 示例数据库
  mysql-example:
    image: mysql:8.0
    container_name: deepeye-mysql-example
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysqlroot}
      MYSQL_DATABASE: ${MYSQL_EXAMPLE_DB:-ecommerce_example}
      MYSQL_USER: ${MYSQL_EXAMPLE_USER:-example_user}
      MYSQL_PASSWORD: ${MYSQL_EXAMPLE_PASSWORD:-example_pass}
    ports:
      - "${MYSQL_EXAMPLE_PORT:-3307}:3306"
    volumes:
      - mysql_example_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysqlroot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepeye-network
    command: --default-authentication-plugin=mysql_native_password
    profiles:
      - example  # 使用 docker-compose --profile example up 启动

  # PostgreSQL 示例数据库
  postgres-example:
    image: postgres:15-alpine
    container_name: deepeye-postgres-example
    environment:
      POSTGRES_DB: ${POSTGRES_EXAMPLE_DB:-ecommerce_example}
      POSTGRES_USER: ${POSTGRES_EXAMPLE_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_EXAMPLE_PASSWORD:-example_pass}
    ports:
      - "${POSTGRES_EXAMPLE_PORT:-5433}:5432"
    volumes:
      - postgres_example_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_EXAMPLE_USER:-example_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepeye-network
    profiles:
      - example  # 使用 docker-compose --profile example up 启动

  minio:
    image: minio/minio:latest
    container_name: deepeye-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - deepeye-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  postgres_example_data:
    driver: local
  mysql_example_data:
    driver: local
  minio_data:
    driver: local

networks:
  deepeye-network:
    driver: bridge


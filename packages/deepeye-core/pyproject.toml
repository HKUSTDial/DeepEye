[project]
name = "deepeye-core"
version = "0.1.0"
description = "DeepEye Core SDK - 数据智能体编排核心引擎"
authors = [{name = "DeepEye Team", email = "team@deepeye.ai"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "agent", "workflow", "data-analysis", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    # LLM 相关
    "openai>=1.6.0",
    "anthropic>=0.8.0",
    # 代码执行沙盒
    "llm-sandbox[docker]>=0.1.0",
    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    # 可视化
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    # 数据库
    "sqlalchemy>=2.0.0",
    # 日志和监控
    "structlog>=23.2.0",
    # 存储
    "minio>=7.2.0",
    # 工具库
    "networkx>=3.2.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.7.0",
    "ruff>=0.1.8",
    "ipython>=8.18.0",
    "jupyter>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[project.urls]
Homepage = "https://deepeye.ai"
Repository = "https://github.com/deepeye-ai/deepeye"
Documentation = "https://docs.deepeye.ai"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepeye"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=deepeye --cov-report=html --cov-report=term"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
]

name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install workspace dependencies
        run: uv sync --all-groups

      - name: Run ruff baseline
        run: uv run ruff check packages/core/deepeye/workflows packages/core/tests packages/backend/app/test

      - name: Run tests
        run: uv run pytest packages/backend/app/test packages/core/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --maxWorkers=1 --no-file-parallelism

      - name: Build
        run: npm run build

  video-preview:
    name: Video Preview App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docker/video-preview-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docker/video-preview-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export Python requirements
        run: uv export --all-packages --all-extras --all-groups --no-hashes --no-emit-workspace --frozen --output-file /tmp/deepeye-requirements.txt > /dev/null

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit -r /tmp/deepeye-requirements.txt --format columns --progress-spinner off

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/frontend/package-lock.json
            docker/video-preview-app/package-lock.json

      - name: Audit frontend dependencies
        working-directory: packages/frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Audit video preview dependencies
        working-directory: docker/video-preview-app
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare example environment
        run: cp env.example .env

      - name: Validate compose config
        run: scripts/smoke-compose.sh

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      # Internal credentials
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # This variable is read by our custom init script
      - POSTGRES_MULTIPLE_DATABASES=deepeye,deepeye_state
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount init script to auto-create databases
      - ./docker/scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 测试用学校数据库
  school-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=school
      - POSTGRES_PASSWORD=school123
      - POSTGRES_DB=school_db
    volumes:
      - school_db_data:/var/lib/postgresql/data
      - ./docker/test-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # DeepEye 测试数据库
  deepeye-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=deepeye
      - POSTGRES_PASSWORD=deepeye123
      - POSTGRES_DB=deepeye_demo
    volumes:
      - deepeye_db_data:/var/lib/postgresql/data
      - ./docker/test-db/deepeye_dataset_pg.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepeye -d deepeye_demo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # Removed direct port mapping to host
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/core:/app/packages/core
      # Mount Docker socket to manage sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  backend-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/core:/app/packages/core
      # Mount Docker socket to manage sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend-react
    # Removed direct port mapping to host
    environment:
      # Automatically derive VITE_API_URL from the host gateway port
      - VITE_API_URL=/api/v1
      - VITE_AUTH_URL=/api/auth
      - VITE_API_TIMEOUT=30000
    volumes:
      - ./packages/frontend-react/src:/app/src
      - /app/node_modules
    depends_on:
      - backend-api
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "${HOST_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-api
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  minio_data:
  school_db_data:
  deepeye_db_data:

networks:
  default:
